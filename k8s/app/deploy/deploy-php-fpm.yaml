apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpn-php-fpm
  namespace: cpn-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpn-php-fpm
  template:
    metadata:
      labels:
        app: cpn-php-fpm
    spec:
      initContainers:
        - name: migrate
          image: phavane/site_sae-php-fpm:latest
          envFrom:
            - configMapRef:
                name: cpn-app-config
            - secretRef:
                name: cpn-app-secret
          volumeMounts:
            - name: laravel-storage
              mountPath: /var/www/storage
            - name: laravel-photos
              mountPath: /var/www/public/storage
            - name: env-file
              mountPath: /var/www/.env
              subPath: .env
          command: ["sh", "-c", "php artisan migrate --force || true"]
          workingDir: /var/www
      containers:
        - name: php-fpm
          image: phavane/site_sae-php-fpm:latest
          command: ["php-fpm", "-F"]
          envFrom:
            - configMapRef:
                name: cpn-app-config
            - secretRef:
                name: cpn-app-secret
          volumeMounts:
            - name: laravel-storage
              mountPath: /var/www/storage
            - name: laravel-photos
              mountPath: /var/www/public/storage
            - name: env-file
              mountPath: /var/www/.env
              subPath: .env
          ports:
            - containerPort: 9000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: laravel-storage
          persistentVolumeClaim:
            claimName: laravel-storage-pvc
        - name: laravel-photos
          persistentVolumeClaim:
            claimName: laravel-photos-pvc
        - name: env-file
          configMap:
            name: cpn-env-file
