---
- name: Read master join token
  set_fact:
    k3s_master_token: "{{ lookup('file', 'ansible/files/k3s-token') }}"

- name: Install K3s worker
  shell: |
    curl -sfL https://get.k3s.io | K3S_URL="https://{{ hostvars['k3s-master'].ansible_host }}:6443" K3S_TOKEN="{{ k3s_master_token }}" sh -
  args:
    creates: /usr/local/bin/k3s
